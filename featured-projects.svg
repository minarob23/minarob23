<svg xmlns="http://www.w3.org/2000/svg" width="320" height="56" viewBox="0 0 320 56" role="img" aria-label="Featured Projects" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FF41"/><stop offset="0.5" stop-color="#00d4ff"/><stop offset="1" stop-color="#00FF41"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="312" height="48" rx="24" fill="#0d1117"/>
  <rect x="4" y="4" width="312" height="48" rx="24" fill="none" stroke="url(#g)" stroke-width="2.5" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="34" cy="28" r="5" fill="#00FF41">
    <animate attributeName="r" values="4;6.5;4" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="160" y="34" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="16" font-weight="700" letter-spacing="2" fill="#ffffff">FEATURED PROJECTS</text>
  <text x="292" y="34" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="18" font-weight="700" fill="#00FF41">
    ▸<animate attributeName="x" values="288;296;288" dur="1.2s" repeatCount="indefinite"/>
  </text>
</svg>
